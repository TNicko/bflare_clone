# Observability stack: Alloy → Loki + Prometheus → Grafana
#
# From repo root:
#   ./deploy/scripts/observability-up.sh
#   ./deploy/scripts/observability-down.sh
#
# See README.md for verification steps.
#
# Project name defaults to harvest-obs (separate from harvest-dev / harvest-prod).
# UI ports bind to 127.0.0.1 — use Tailscale Serve (or SSH tunnel) for Grafana;
# do not expose them on the public Hetzner firewall.

name: harvest-obs

services:
  loki:
    image: grafana/loki:3.4.3
    container_name: harvest-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      # Default localhost-only. On a dedicated obs host with a remote Alloy agent,
      # set LOKI_HOST_BIND to this machine's Tailscale IP (or 0.0.0.0 behind Tailscale ACL).
      - "${LOKI_HOST_BIND:-127.0.0.1}:3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/ready | grep -q ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: harvest-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "${PROMETHEUS_HOST_BIND:-127.0.0.1}:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/ready | grep -q Prometheus",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  cadvisor:
    # Docker 29 (Linux): prefer containerd via docker-compose.cadvisor-linux.yml
    # (observability-up.sh adds it automatically on Linux).
    # Do not mount /var/run:ro together with docker.sock — Docker Desktop maps
    # docker.proxy.sock into /var/run/docker.sock and fails with read-only FS.
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: harvest-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true
      - --disable_metrics=disk
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.7.5
    container_name: harvest-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.1.2
    container_name: harvest-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Override via deploy/observability/.env (see .example.env)
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/harvest/harvest-overview.json
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
