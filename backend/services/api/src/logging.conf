[loggers]
keys=root,src

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
# Prevent third-party loggers (e.g. Telethon) from logging at INFO level.
level=WARNING
handlers=consoleHandler

[logger_src]
level=INFO
handlers=consoleHandler
qualname=src
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s
