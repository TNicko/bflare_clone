apiVersion: 1

providers:
  - name: harvest
    orgId: 1
    folder: Harvest
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/harvest
      foldersFromFilesStructure: false
  - name: fleet
    orgId: 1
    folder: Fleet
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/fleet
      foldersFromFilesStructure: false
